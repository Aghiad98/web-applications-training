<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syria Map</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <div class="map">
    <button type="button" class="gov hasakah" data-bs-toggle="modal" data-bs-target="#govModal" data-name="Hasakah">
      <img src="img/hasakah.png" alt="Hasakah">
    </button>
    <button type="button" class="gov aleppo" data-bs-toggle="modal" data-bs-target="#govModal" data-name="Aleppo">
      <img src="img/aleppo.png" alt="Aleppo">
    </button>
    <button type="button" class="gov raqqa" data-bs-toggle="modal" data-bs-target="#govModal" data-name="Raqqa">
      <img src="img/raqqa.png" alt="Raqqa">
    </button>
    <button type="button" class="gov deir-al-zor" data-bs-toggle="modal" data-bs-target="#govModal" data-name="Deir al-Zor">
      <img src="img/deir-al-zor.png" alt="Deir al-Zor">
    </button>
    <button type="button" class="gov idlib" data-bs-toggle="modal" data-bs-target="#govModal" data-name="Idlib">
      <img src="img/idlib.png" alt="Idlib">
    </button>
    <button type="button" class="gov lattakia" data-bs-toggle="modal" data-bs-target="#govModal" data-name="Lattakia">
      <img src="img/lattakia.png" alt="Lattakia">
    </button>
    <button type="button" class="gov homs" data-bs-toggle="modal" data-bs-target="#govModal" data-name="Homs">
      <img src="img/homs.png" alt="Homs">
    </button>
    <button type="button" class="gov hama" data-bs-toggle="modal" data-bs-target="#govModal" data-name="Hama">
      <img src="img/hama.png" alt="Hama">
    </button>
    <button type="button" class="gov tartus" data-bs-toggle="modal" data-bs-target="#govModal" data-name="Tartus">
      <img src="img/tartus.png" alt="Tartus">
    </button>
    <button type="button" class="gov damascus" data-bs-toggle="modal" data-bs-target="#govModal" data-name="Damascus">
      <img src="img/damascus.png" alt="Damascus">
    </button>
    <button type="button" class="gov quneitra" data-bs-toggle="modal" data-bs-target="#govModal" data-name="Quneitra">
      <img src="img/quneitra.png" alt="Quneitra">
    </button>
    <button type="button" class="gov daraa" data-bs-toggle="modal" data-bs-target="#govModal" data-name="Daraa">
      <img src="img/daraa.png" alt="Daraa">
    </button>
    <button type="button" class="gov ALSuwayda" data-bs-toggle="modal" data-bs-target="#govModal" data-name="ALSuwayda">
      <img src="img/as-suwayda.png" alt="ALSuwayda">
    </button>

    <span class="label lbl-hasakah">Hasakah</span>
    <span class="label lbl-aleppo">Aleppo</span>
    <span class="label lbl-raqqa">Raqqa</span>
    <span class="label lbl-deir-al-zor">Deir al-Zor</span>
    <span class="label lbl-idlib">Idlib</span>
    <span class="label lbl-lattakia">Lattakia</span>
    <span class="label lbl-homs">Homs</span>
    <span class="label lbl-hama">Hama</span>
    <span class="label lbl-tartus">Tartus</span>
    <span class="label lbl-damascus">Damascus</span>
    <span class="label lbl-quneitra">Quneitra</span>
    <span class="label lbl-daraa">Daraa</span>
    <span class="label lbl-ALSuwayda">ALSuwayda</span>
    </div>
  </div>

  <!-- Bootstrap modal -->
  <div class="modal fade" id="govModal" tabindex="-1" aria-labelledby="govTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="govTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // the only custom JS: put the clicked governorate's name into the modal title
    document.getElementById('govModal').addEventListener('show.bs.modal', e => {
      document.getElementById('govTitle').textContent = e.relatedTarget.dataset.name;
    });
  </script>
</body>
</html>
